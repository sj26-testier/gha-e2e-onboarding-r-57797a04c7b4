name: Image-default SwiftFormat controls
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  framework:
    name: Framework image default (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-27, macos-latest]
    steps:
      - name: Record image default without selecting Xcode
        run: |
          echo "LAB_IMAGE label=${{ matrix.os }} runner_os=$RUNNER_OS runner_arch=$RUNNER_ARCH"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version
          for app in /Applications/Xcode*.app; do
            printf 'LAB_INSTALLED_XCODE %s ' "$app"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/version.plist"
          done
          for name in RUNNER_TEMP TMPDIR GITHUB_WORKSPACE; do
            printf 'LAB_ENV %s=%s\n' "$name" "${!name-}"
          done
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream into home-directory control
        run: |
          # Adaptation: unchanged upstream source, outside /tmp symlink aliases.
          root=$(mktemp -d "$HOME/gha-swiftformat-XXXXXXXX")
          git -C "$root" init
          git -C "$root" fetch --no-tags --depth=1 https://github.com/nicklockwood/SwiftFormat.git 468a7d32dedc8d352c191594b3b45d9fd8ba291b
          git -C "$root" checkout --detach FETCH_HEAD
          echo "LAB_SOURCE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Unchanged upstream framework build tests and coverage
        run: |
          cd "$LAB_SOURCE_ROOT"
          pwd -P
          test "$(git rev-parse HEAD)" = 468a7d32dedc8d352c191594b3b45d9fd8ba291b
          git config user.name "test user"
          git config user.email "test.user@noreply.com"
          xcodebuild -project SwiftFormat.xcodeproj -scheme "SwiftFormat (Framework)" -sdk macosx clean build test -enableCodeCoverage YES -derivedDataPath Build/
          cd Build/Build/ProfileData
          cd $(ls -d */|head -n 1)
          directory=${PWD##*/}
          pathCoverage=Build/Build/ProfileData/${directory}/Coverage.profdata
          cd ../../../../
          xcrun llvm-cov export -format="lcov" -instr-profile $pathCoverage Build/Build/Products/Debug/SwiftFormat.framework/SwiftFormat > info.lcov
          test -s info.lcov
          echo "LAB_WORKLOAD_PASS swiftformat-image-default label=${{ matrix.os }}"
