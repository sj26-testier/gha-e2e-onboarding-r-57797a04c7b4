name: SwiftFormat universal binary corrected
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  universal-binary:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nicklockwood/SwiftFormat
          ref: 468a7d32dedc8d352c191594b3b45d9fd8ba291b
      - name: Build and exercise universal release binary
        run: |
          echo "LAB_IMAGE label=macos-latest runner_os=$RUNNER_OS runner_arch=$RUNNER_ARCH"
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
          test "$(git rev-parse HEAD)" = 468a7d32dedc8d352c191594b3b45d9fd8ba291b
          swift build -c release --arch arm64 --arch x86_64 -Xswiftc -Osize
          strip -rSTx .build/apple/Products/Release/swiftformat
          lipo .build/apple/Products/Release/swiftformat -verify_arch arm64 x86_64
          .build/apple/Products/Release/swiftformat --version
          arch -x86_64 .build/apple/Products/Release/swiftformat --version
          echo 'LAB_WORKLOAD_PASS swiftformat-universal'
