name: libuv traversable-workspace control
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  libuv:
    name: Full libuv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-27]
    steps:
      - name: Record image default
        run: |
          echo "LAB_IMAGE label=${{ matrix.os }} runner_os=$RUNNER_OS runner_arch=$RUNNER_ARCH"
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream in traversable shared workspace
        run: |
          stat -f 'LAB_PARENT_MODE=%Lp path=%N' "$HOME" /Users /Users/Shared
          root=$(mktemp -d /Users/Shared/gha-libuv-XXXXXXXX)
          stat -f 'LAB_INITIAL_ROOT_MODE=%Lp' "$root"
          # Upstream spawn tests drop to nobody and must traverse the source path.
          # Do not relax permissions on the runner's private home directory.
          chmod 755 "$root"
          sudo -u nobody test -x "$root"
          stat -f 'LAB_CONTROL_ROOT_MODE=%Lp' "$root"
          git -C "$root" init
          git -C "$root" fetch --no-tags --depth=1 https://github.com/libuv/libuv.git 338ac6ac0714e6d8043a2826c9b3bc78e85bb961
          git -C "$root" checkout --detach FETCH_HEAD
          echo "LAB_SOURCE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Upstream CMake build
        run: |
          cd "$LAB_SOURCE_ROOT"
          test "$(git rev-parse HEAD)" = 338ac6ac0714e6d8043a2826c9b3bc78e85bb961
          cmake -B build -DBUILD_TESTING=ON
          cmake --build build -j4
      - name: Full upstream tests in non-terminal session
        id: full-tests
        continue-on-error: true
        run: |
          cd "$LAB_SOURCE_ROOT/build"
          python3 - <<'PY'
          import subprocess, sys, time
          start = time.monotonic()
          result = subprocess.run(['sudo', 'UV_RUN_AS_ROOT=1', 'ctest', '-V', '--timeout', '240'], start_new_session=True)
          print(f'LAB_CTEST detached=true exit={result.returncode} seconds={time.monotonic()-start:.1f}', flush=True)
          sys.exit(result.returncode)
          PY
      - name: Upstream iOS27 cross-build
        if: matrix.os == 'macos-27'
        run: |
          cd "$LAB_SOURCE_ROOT"
          cmake -B build-ios -GXcode -DCMAKE_SYSTEM_NAME:STRING=iOS -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED:BOOL=NO -DCMAKE_CONFIGURATION_TYPES:STRING=Release
          cmake --build build-ios
          test -s build-ios/Release-iphoneos/libuv.a
          echo 'LAB_WORKLOAD_PASS libuv-ios27'
      - name: Preserve full-suite failure
        if: always()
        run: |
          echo 'LAB_FULL_SUITE_OUTCOME=${{ steps.full-tests.outcome }}'
          test '${{ steps.full-tests.outcome }}' = success
