name: SwiftFormat Xcode27 deployment-target control
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  framework:
    runs-on: macos-27
    timeout-minutes: 20
    steps:
      - name: Record image-default Xcode
        run: |
          echo "LAB_IMAGE label=macos-27 runner_os=$RUNNER_OS runner_arch=$RUNNER_ARCH"
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version
          swift --version
      - uses: actions/checkout@v4
      - name: Fetch unchanged pinned upstream into home
        run: |
          root=$(mktemp -d "$HOME/gha-swiftformat-XXXXXXXX")
          git -C "$root" init
          git -C "$root" fetch --no-tags --depth=1 https://github.com/nicklockwood/SwiftFormat.git 468a7d32dedc8d352c191594b3b45d9fd8ba291b
          git -C "$root" checkout --detach FETCH_HEAD
          echo "LAB_SOURCE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Framework tests with supported deployment target
        run: |
          cd "$LAB_SOURCE_ROOT"
          test "$(git rev-parse HEAD)" = 468a7d32dedc8d352c191594b3b45d9fd8ba291b
          git config user.name "test user"
          git config user.email "test.user@noreply.com"
          # Adaptation: Xcode27 rejects upstream's 10.14 deployment target.
          # Only the deployment target changes; source/tests and default Xcode do not.
          xcodebuild -project SwiftFormat.xcodeproj -scheme "SwiftFormat (Framework)" -sdk macosx clean build test -enableCodeCoverage YES -derivedDataPath Build/ MACOSX_DEPLOYMENT_TARGET=12.0
          echo 'LAB_WORKLOAD_PASS swiftformat-xcode27-deployment12'
